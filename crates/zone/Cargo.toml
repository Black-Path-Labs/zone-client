[package]
name = "zone"
description = "Command-line client for Black Path Zones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zone"
path = "src/main.rs"

[dependencies]
bp-workspace-core.workspace = true
bp-zone-core.workspace = true
bp-zone-fs.workspace = true
bp-zone-rtc.workspace = true
aes-gcm = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
# SIP over WebSocket for `zone run`'s live session; rustls and the webpki roots, as ureq.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# HTTP(S) for the SDK's CoreTransport; rustls, so no system TLS library.
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
