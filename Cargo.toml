[workspace]
resolver = "2"
members = ["crates/zone"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Black-Path-Labs/zone-client"
publish = false

# The zone SDK, pinned to one zone-sdk commit. `zone --version` reports this revision; bump it
# here and in Cargo.lock together.
[workspace.dependencies]
bp-workspace-core = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "e39e975903a7065b111eae5a9e5d7edd0229c53f" }
bp-zone-core = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "e39e975903a7065b111eae5a9e5d7edd0229c53f" }
bp-zone-rtc = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "e39e975903a7065b111eae5a9e5d7edd0229c53f" }

# The SDK's RustCrypto arithmetic is built optimised even in test builds, as in zone-sdk.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1
