[workspace]
resolver = "2"
members = ["crates/zone"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Black-Path-Labs/zone-client"
publish = false

# The zone SDK, pinned to one zone-sdk commit. `zone --version` reports this revision; bump it
# here and in Cargo.lock together.
[workspace.dependencies]
bp-workspace-core = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "073eaee499240d559200afff9dee0e512b4eaa26" }
# No default features: the client reads only the current format names, not the legacy ones.
bp-zone-core = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "073eaee499240d559200afff9dee0e512b4eaa26", default-features = false }
bp-zone-rtc = { git = "https://github.com/Black-Path-Labs/zone-sdk", rev = "073eaee499240d559200afff9dee0e512b4eaa26" }

# The SDK's RustCrypto arithmetic is built optimised even in test builds, as in zone-sdk.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1
